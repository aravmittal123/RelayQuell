name: agentbreaker
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: flagsmith
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 5s
      retries: 30
  flagsmith:
    image: flagsmith/flagsmith:latest
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Run python scripts/configure.py first}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/flagsmith
      DJANGO_ALLOWED_HOSTS: '*'
      ENABLE_ADMIN_ACCESS_USER_PASS: 'true'
      ALLOW_REGISTRATION_WITHOUT_INVITE: 'true'
      USE_POSTGRES_FOR_ANALYTICS: 'true'
      ENV: prod
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 60
  mock-mcp:
    build: ./demo
    command: [uvicorn, mock_mcp_server:app, --host, 0.0.0.0, --port, '8090']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 5s
      retries: 20
  mock-llm:
    build: ./demo
    command: [uvicorn, mock_llm_server:app, --host, 0.0.0.0, --port, '8091']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8091/health')"]
      interval: 5s
      retries: 20
  gateway:
    build: ./gateway
    ports: ["127.0.0.1:8085:8085"]
    env_file:
      - path: .env.runtime
        required: false
    environment:
      FLAGSMITH_API_URL: ${FLAGSMITH_API_URL:-http://flagsmith:8000/api/v1/}
      UPSTREAM_MCP_URL: ${UPSTREAM_MCP_URL:-http://mock-mcp:8090/mcp}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000","http://localhost:3001","http://127.0.0.1:3001"]}
      MAX_DOCUMENT_AGE_SECONDS: ${MAX_DOCUMENT_AGE_SECONDS:-30}
      UPSTREAM_LLM_URL: ${UPSTREAM_LLM_URL:-http://mock-llm:8091/v1/chat/completions}
      UPSTREAM_LLM_API_KEY: ${UPSTREAM_LLM_API_KEY:-}
    depends_on:
      flagsmith: {condition: service_healthy}
      mock-mcp: {condition: service_healthy}
      mock-llm: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8085/health')"]
      interval: 5s
      retries: 30
  dashboard:
    build:
      context: ./dashboard
      args:
        NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:8085}
    ports: ["127.0.0.1:${DASHBOARD_PORT:-3000}:3000"]
    depends_on:
      gateway: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 30
volumes:
  postgres_data:
