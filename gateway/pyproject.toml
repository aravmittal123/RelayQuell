[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbreaker"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = ["fastapi==0.165.0", "uvicorn==0.54.0", "httpx==0.28.1", "flagsmith==6.7.0", "pydantic-settings==2.16.3"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.6"]

[tool.pytest.ini_options]
pythonpath = [".", "gateway"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.packages.find]
include = ["app*"]
